name: Mise a jour BlaBlaCar La Turbie

on:
  workflow_dispatch:
  schedule:
    - cron: "27 3 * * *"

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generer le catalogue BlaBlaCar La Turbie
        run: python scripts/build_blablacar_turbie_catalog.py

      - name: Verifier le catalogue
        run: |
          test -s data/blablacar_turbie.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/blablacar_turbie.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          buses = data.get("buses", [])
          assert isinstance(buses, list), "buses absent"
          print(f"Catalogue valide : {len(buses)} passages BlaBlaCar")
          PY

      - name: Publier le nouveau catalogue dans le depot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blablacar_turbie.json
          if git diff --cached --quiet; then
            echo "Aucun changement a publier."
            exit 0
          fi
          git commit -m "Mise a jour automatique BlaBlaCar La Turbie"
          git push
